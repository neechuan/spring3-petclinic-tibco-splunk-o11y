receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus/activemq:
    config:
      scrape_configs:
        - job_name: activemq
          scrape_interval: 15s
          static_configs:
            - targets: [petclinic-activemq-exporter:9404]

exporters:
  otlp_http/traces:
    traces_endpoint: https://ingest.${SPLUNK_REALM}.signalfx.com/v2/trace/otlp
    headers:
      X-SF-Token: ${SPLUNK_ACCESS_TOKEN}

  otlp_http/metrics:
    metrics_endpoint: https://ingest.${SPLUNK_REALM}.observability.splunkcloud.com/v2/datapoint/otlp
    headers:
      X-SF-Token: ${SPLUNK_ACCESS_TOKEN}
  
  debug:
    verbosity: detailed

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s
  attributes:
    actions:
      - key: deployment.environment
        value: lab
        action: insert
      - key: service.version
        value: 1.0
        action: insert

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: ${OTEL_COLLECTOR_LOG_LEVEL}
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes, batch]
      exporters: [otlp_http/traces]

    metrics:
      receivers: [otlp, prometheus/activemq]
      processors: [attributes, batch]
      exporters: [debug, otlp_http/metrics]
