hostPort: petclinic-tibco:1099
lowercaseOutputName: true
lowercaseOutputLabelNames: true

whitelistObjectNames:
  - 'org.apache.activemq:*'

rules:
  - pattern: 'org.apache.activemq<type=Broker, brokerName=(.+), destinationName=(.+), destinationType=(.+)><>(.+)'
    name: activemq_destination_$4
    labels:
      broker: '$1'
      destination_type: '$3'
      destination: '$2'
  - pattern: 'org.apache.activemq<.*brokerName=(.+),destinationName=(.+),destinationType=(.+),type=Broker><>(.+)'
    name: activemq_destination_$4
    labels:
      broker: '$1'
      destination_type: '$3'
      destination: '$2'
  - pattern: 'org.apache.activemq<type=Broker, brokerName=(.+)><>(.+)'
    name: activemq_broker_$2
    labels:
      broker: '$1'